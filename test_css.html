<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --font-primary: 'Arial', sans-serif;
  }
  body {
    font-family: var(--font-primary);
  }
</style>
</head>
<body>
  <h1 id="text">Hello World</h1>
  <button onclick="document.documentElement.style.setProperty('--font-primary', '\'Times New Roman\', serif')">Change Font</button>
</body>
</html>
